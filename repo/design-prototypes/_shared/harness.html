<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>War-Room Skin Harness · bridge v1</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #cbd5e1; font: 12px/1.4 "Microsoft YaHei UI", system-ui, sans-serif; }
  #bar { position: fixed; left: 0; right: 0; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; background: #12151c; border-bottom: 1px solid #252a36; }
  #bar.min > *:not(#toggleBar) { display: none; }
  #bar select, #bar button { font: inherit; color: #e2e8f0; background: #1c2230; border: 1px solid #2f3747; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  #bar button.on { background: #0e7490; border-color: #22d3ee; }
  #bar .sep { width: 1px; height: 18px; background: #2f3747; margin: 0 2px; }
  #stage { position: fixed; left: 0; right: 0; top: 40px; bottom: 0; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 8px; }
  #frameWrap { position: relative; flex: none; box-shadow: 0 0 0 1px #2f3747; }
  #frameWrap.fit { width: 100% !important; height: 100% !important; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  #log { position: fixed; right: 8px; bottom: 8px; z-index: 11; width: 380px; max-height: 38vh; overflow: auto; background: rgba(10,12,18,0.94); border: 1px solid #2f3747; border-radius: 8px; padding: 6px 8px; font: 11px/1.45 Consolas, monospace; }
  #log.hidden { display: none; }
  #log div { white-space: pre-wrap; word-break: break-all; border-bottom: 1px dashed #1f2533; padding: 2px 0; }
  #log .act { color: #7dd3fc; } #log .res { color: #86efac; } #log .warn { color: #fca5a5; }
</style>
</head>
<body>
<div id="bar">
  <button id="toggleBar" title="收起/展开控制条">≡</button>
  <select id="skin"><option value="nova-deck">A · 星舰剪辑甲板</option><option value="ink-loom">B · 墨韵织机</option><option value="prism-lab">C · 棱镜实验室</option></select>
  <select id="vp">
    <option value="fit">铺满窗口</option><option value="1100x640">1100×640 (DSH 面板)</option><option value="1280x720">1280×720</option>
    <option value="1440x900">1440×900</option><option value="1600x900">1600×900</option><option value="1920x1080" selected>1920×1080</option><option value="2560x1440">2560×1440</option>
  </select>
  <span class="sep"></span>
  <button data-sc="onboarding">无工程</button>
  <button data-sc="idle">空闲工程</button>
  <button data-sc="run">▶ 模拟运行</button>
  <select id="speed"><option value="1">1×</option><option value="3" selected>3×</option><option value="8">8×</option></select>
  <button data-sc="pause">⏸ 暂停</button>
  <button data-sc="resume">继续</button>
  <button data-sc="fail">✖ 失败</button>
  <button data-sc="stop">■ 停止</button>
  <button data-sc="complete">✔ 完成</button>
  <span class="sep"></span>
  <button id="staging">云端待确认</button>
  <button id="lowspec">低配保护</button>
  <button id="avatar">数字人</button>
  <button id="toggleLog">动作日志</button>
</div>
<div id="stage"><div id="frameWrap"><iframe id="skinFrame" title="war room skin"></iframe></div></div>
<div id="log"></div>
<script>
(() => {
  'use strict'
  const $ = (s) => document.querySelector(s)
  const qs = new URLSearchParams(location.search)
  const frame = $('#skinFrame')
  const abs = (rel) => new URL(rel, location.href).href
  const TPL = '../../templates/cinepulse-hub/'
  const COVERS = ['history-epic-beat', 'tech-launch-keynote', 'saas-ui-tutorial', 'science-visual-explainer', 'data-ranking-story'].map((id) => abs(TPL + id + '/cover.png'))
  const PREVIEW_MP4 = abs(TPL + 'history-epic-beat/preview.mp4')
  const log = (cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = new Date().toLocaleTimeString() + ' ' + text; $('#log').appendChild(d); $('#log').scrollTop = 1e9 }

  let sample = null
  let state = null
  let speed = 3
  let sim = null // { t, plan, timer, paused }

  const AGENTS = [
    ['director', '策划导演', 'DIRECTOR'], ['editor', '素材剪辑', 'EDITOR'], ['audio', '配音混音', 'AUDIO'], ['motion', '动效编程', 'MOTION CODER'],
    ['qa', '质检渲染', 'QA · RENDER'], ['avatar', '数字人', 'AVATAR'], ['cloud', '云端生成', 'CLOUD GEN'], ['reference', '参考复刻', 'REFERENCE'],
  ]
  const opts = (pairs) => pairs.map(([value, label]) => ({ value, label }))

  function baseState() {
    const s = sample
    const kindOf = (t) => (t === 'voice' ? 'voice' : t === 'cloud' ? 'image' : t)
    const assets = s.assets.filter((a) => !a.staged).map((a, i) => ({
      id: 'asset-' + i, kind: kindOf(a.type), name: a.name,
      url: a.type === 'image' ? COVERS[i % COVERS.length] : a.type === 'video' ? PREVIEW_MP4 : '',
      thumbUrl: a.type === 'image' || a.type === 'video' ? COVERS[i % COVERS.length] : '',
      durationSec: a.dur || null, width: a.type === 'image' ? 1920 : null, height: a.type === 'image' ? 1080 : null,
      usedBySceneIds: a.type === 'image' ? s.scenes.filter((_, k) => k % 4 === i % 4).slice(0, 6).map((sc) => sc.id) : [],
    }))
    return {
      v: 1, ts: Date.now(), skin: $('#skin').value, host: 'standalone', lowSpec: $('#lowspec').classList.contains('on'), busy: '',
      project: { dir: 'D:/demo/huoqubing', title: s.title, engine: 'remotion', aspectRatio: '16:9', width: 1920, height: 1080, fps: s.fps, quality: '1080p', genreLabel: s.genre, style: 'cinematic', narrationMode: 'subtitle-mv', durationSec: s.durationSec },
      projects: [
        { dir: 'D:/demo/huoqubing', title: s.title, engine: 'remotion', updatedAt: new Date().toISOString(), hasMp4: false },
        { dir: 'D:/demo/promo', title: 'DSH Video Workbench：双引擎全链路，开源即开拍', engine: 'remotion', updatedAt: new Date(Date.now() - 864e5).toISOString(), hasMp4: true },
        { dir: 'D:/demo/tutorial', title: 'DSH 视频工作台实操：从新建工程到质检导出', engine: 'remotion', updatedAt: new Date(Date.now() - 2 * 864e5).toISOString(), hasMp4: true },
      ],
      assets,
      staging: [],
      run: null,
      agents: AGENTS.map(([id, name, en]) => ({ id, name, en, status: 'idle', progress: 0, message: '待命' })),
      logs: [{ ts: new Date().toISOString(), agentId: 'system', level: 'info', text: '工作台就绪 · 8 位 Agent 待命' }],
      timeline: {
        totalSec: s.durationSec, fps: s.fps, bpm: s.bpm, beats: s.beats, drops: s.drops,
        scenes: s.scenes.map((sc, i) => ({ id: sc.id, index: i, title: sc.title, startSec: sc.startSec, durationSec: sc.durationSec, subtitle: sc.subtitle, thumbUrl: '', hasVoice: false, sfx: (sc.sfx || []).map((x) => ({ type: x.type, t: x.t })), locked: false })),
        music: [{ name: '战歌BGM_90BPM.mp3', startSec: 0, endSec: s.durationSec }],
      },
      preview: { mp4Url: '', posterUrl: COVERS[0], hasMp4: false, durationSec: 0 },
      director: { topic: '霍去病：你把少年留在大汉。以 90 BPM 战歌卡点，剪影战斗高燃叙事', engine: 'remotion', creationMode: 'ai-coded', aspectRatio: '16:9', quality: '1080p', fps: 30, durationMode: 'auto', targetDurationSec: 120, narrationMode: 'subtitle-mv', bgmMode: 'uploaded', pacingMode: 'dynamic', style: 'cinematic', voiceId: 'auto', avatarEnabled: $('#avatar').classList.contains('on'), avatarLayout: 'pip-br' },
      options: {
        engines: opts([['remotion', 'Remotion + Three.js'], ['html', 'HTML5 + GSAP']]),
        creationModes: opts([['ai-coded', 'AI 逐镜编码'], ['fast-draft', '本地草稿预演']]),
        aspectRatios: opts([['auto', 'AI 自动'], ['16:9', '16:9 横屏'], ['9:16', '9:16 竖屏'], ['1:1', '1:1'], ['3:4', '3:4']]),
        qualities: opts([['720p', '720p'], ['1080p', '1080p'], ['2k', '2K'], ['4k', '4K']]),
        narrationModes: opts([['tts', '口播配音'], ['tts-beat-sync', '口播 + 卡点'], ['subtitle-mv', '纯音乐字幕 MV']]),
        bgmModes: opts([['llm-coded', 'AI 编曲'], ['uploaded', '上传配乐'], ['tts-engine', '语音引擎配乐']]),
        pacingModes: opts([['auto', '自动'], ['calm', '舒缓'], ['balanced', '均衡'], ['dynamic', '强节奏']]),
        styles: opts([['tech', '科技'], ['cinematic', '电影感'], ['documentary', '纪录片'], ['energetic', '活力'], ['warm', '温暖'], ['emerald', '翡翠']]),
        voices: opts([['auto', 'AI 自动匹配'], ['pack-热门音色-中音磁性女声旁白', '中音磁性女声旁白'], ['pack-中年-男声-男-专题-纪录-旁白', '男-专题 纪录 旁白']]),
        avatarLayouts: opts([['pip-br', '右下画中画'], ['pip-bl', '左下画中画'], ['fullscreen', '全屏']]),
      },
      status: { llm: { configured: true, label: 'gpt-6.2-sol' }, tts: { ready: true, label: 'IndexTTS-2.5' }, gpu: { label: 'RTX 5070 Ti · 12 GB', lowSpecMode: 'auto' }, lipsync: { ready: true, label: 'MuseTalk 1.5' } },
      counts: { plazaTemplates: 5, voices: 209 },
    }
  }

  function send(msg) { try { frame.contentWindow.postMessage({ v: 1, ...msg }, '*') } catch (e) { log('warn', 'postMessage failed: ' + e.message) } }
  let pending = false
  function push() { if (!state) return; state.ts = Date.now(); if (pending) return; pending = true; setTimeout(() => { pending = false; send({ type: 'dsh-vw/state', state }) }, 200) }
  const addLog = (agentId, text, level = 'info') => { state.logs.push({ ts: new Date().toISOString(), agentId, level, text }); if (state.logs.length > 60) state.logs.splice(0, state.logs.length - 60) }
  const agent = (id) => state.agents.find((a) => a.id === id)

  // simulated run: [agentId, seconds, [progress-milestone messages]]
  function plan() {
    const p = [
      ['reference', 2, ['解析参考样片：切点 41 处 · 平均镜长 2.3s', '参考风格已绑定 MOTION.md']],
      ['director', 8, ['节拍扫描：90 BPM · 首拍 0.616s', '拆解叙事 → 61 幕分镜', '卡点对齐 214 拍 · 4 个高潮点']],
      ['editor', 7, ['素材智能裁切：4 张剪影图', '调色：赭金电影感 LUT', '素材已就位 V1 轨']],
      ['audio', 8, ['BGM 节拍网格对齐', '战斗音效 56 处精确落点', '母带 -12.2 LUFS · -1.9 dBTP']],
    ]
    if (state.director.avatarEnabled) p.push(['avatar', 6, ['提词器录像 → 克隆声纹', 'MuseTalk 1.5 口型同步', '透明画中画已挂载']])
    p.push(['motion', 10, ['AI 逐镜编码 Batch 1/4', 'TSX 编译自检通过', '61 幕动效就绪']])
    p.push(['qa', 7, ['逐帧渲染 1080p30', '黑屏/闪烁/冻帧质检通过', '成片导出完成']])
    return p
  }

  function startRun() {
    stopSim()
    state = state && state.project ? state : baseState()
    state.agents.forEach((a) => { a.status = 'queued'; a.progress = 0; a.message = '等待调度' })
    if (!state.director.avatarEnabled) Object.assign(agent('avatar'), { status: 'skipped', message: '未启用' })
    Object.assign(agent('cloud'), state.staging.length ? { status: 'done', progress: 100, message: '云端素材待确认' } : { status: 'skipped', message: '未使用云端生成' })
    state.preview = { mp4Url: '', posterUrl: COVERS[0], hasMp4: false, durationSec: 0 }
    const steps = plan()
    const total = steps.reduce((s, x) => s + x[1], 0)
    state.run = { id: 'run-' + Date.now().toString(36), status: 'running', progress: 0, activeAgentId: steps[0][0], elapsedSec: 0, error: '', message: '流水线启动' }
    addLog('system', '⚡ 8 位 Agent 编队启动 · 一键出片')
    send({ type: 'dsh-vw/event', event: 'run-started', data: { runId: state.run.id } })
    sim = { t: 0, steps, total, paused: false, lastIdx: -1, lastMs: -1 }
    sim.timer = setInterval(tick, 100)
    push()
  }
  function tick() {
    if (!sim || sim.paused) return
    sim.t += 0.1 * speed
    state.run.elapsedSec = Math.round(sim.t * 10) / 10
    let acc = 0
    for (let i = 0; i < sim.steps.length; i++) {
      const [id, dur, msgs] = sim.steps[i]
      const a = agent(id)
      if (sim.t >= acc + dur) {
        if (a.status !== 'done') { a.status = 'done'; a.progress = 100; a.message = msgs[msgs.length - 1]; addLog(id, '✓ ' + a.name + '完成：' + msgs[msgs.length - 1]) }
      } else if (sim.t >= acc) {
        const pr = Math.min(99, Math.round(((sim.t - acc) / dur) * 100))
        if (sim.lastIdx !== i) {
          sim.lastIdx = i; sim.lastMs = -1
          state.run.activeAgentId = id
          send({ type: 'dsh-vw/event', event: 'focus-agent', data: { agentId: id } })
        }
        a.status = 'running'; a.progress = pr
        const mi = Math.min(msgs.length - 1, Math.floor((pr / 100) * msgs.length))
        if (mi !== sim.lastMs) { sim.lastMs = mi; a.message = msgs[mi]; state.run.message = a.name + '：' + msgs[mi]; addLog(id, msgs[mi]) }
      }
      acc += dur
    }
    state.run.progress = Math.min(100, Math.round((sim.t / sim.total) * 100))
    if (sim.t >= sim.total) complete()
    push()
  }
  function stopSim() { if (sim?.timer) clearInterval(sim.timer); sim = null }
  function complete() {
    stopSim()
    if (!state.run) return
    state.run.status = 'completed'; state.run.progress = 100; state.run.activeAgentId = null; state.run.message = '成片已完成 · 质检全部通过'
    state.agents.forEach((a) => { if (a.status === 'running' || a.status === 'queued') { a.status = 'done'; a.progress = 100 } })
    state.preview = { mp4Url: PREVIEW_MP4, posterUrl: COVERS[0], hasMp4: true, durationSec: 15.33 }
    state.timeline.scenes.forEach((sc, i) => { sc.thumbUrl = COVERS[i % COVERS.length]; sc.hasVoice = true })
    state.projects[0].hasMp4 = true
    addLog('system', '✅ 协同作战流水线已全部完成！')
    send({ type: 'dsh-vw/event', event: 'run-finished', data: { runId: state.run.id, status: 'completed' } })
    push()
  }
  function setRunStatus(status, agentStatus, text, level) {
    if (!state?.run) return
    if (status === 'paused' && sim) sim.paused = true
    if (status === 'running' && sim) sim.paused = false
    if (status === 'failed' || status === 'stopped') stopSim()
    state.run.status = status
    const a = state.run.activeAgentId && agent(state.run.activeAgentId)
    if (a && agentStatus) { a.status = agentStatus; a.message = text }
    if (status === 'failed') state.run.error = text
    state.run.message = text
    addLog(a ? a.id : 'system', text, level || 'info')
    if (status === 'failed' || status === 'stopped') send({ type: 'dsh-vw/event', event: 'run-finished', data: { runId: state.run.id, status } })
    push()
  }

  function scenario(sc) {
    if (sc === 'onboarding') { stopSim(); state = baseState(); state.project = null; state.assets = []; state.run = null; state.timeline.scenes = []; state.timeline.beats = []; state.timeline.music = []; state.timeline.totalSec = 0; push(); return }
    if (sc === 'idle') { stopSim(); state = baseState(); push(); return }
    if (!state || !state.project) state = baseState()
    if (sc === 'run') return startRun()
    if (sc === 'pause') return setRunStatus('paused', 'paused', '⏸️ 用户已暂停当前协同流水线', 'warn')
    if (sc === 'resume') return setRunStatus('running', 'running', '▶️ 用户已恢复运行协同流水线')
    if (sc === 'fail') return setRunStatus('failed', 'failed', '❌ 执行失败：TSX 编译 3 轮自修复后仍报错 (Batch 2 · scene-23)', 'error')
    if (sc === 'stop') return setRunStatus('stopped', 'stopped', '⛔ 用户已立即停止任务并中止关联子进程', 'warn')
    if (sc === 'complete') { if (!state.run) startRun(); return complete() }
  }

  function handleAction(id, action, payload) {
    const ok = (data) => { log('res', '← result ' + action + ' ok'); send({ type: 'dsh-vw/result', id, ok: true, data }) }
    const fail = (error) => { log('warn', '← result ' + action + ' ERROR ' + error); send({ type: 'dsh-vw/result', id, ok: false, error }) }
    const toast = (text, level = 'info') => send({ type: 'dsh-vw/event', event: 'toast', data: { text, level } })
    switch (action) {
      case 'run': if (!state?.project) return fail('请先新建或打开一个视频工程'); if (payload?.topic) state.director.topic = payload.topic; startRun(); return ok({ runId: state.run.id })
      case 'pause': scenario('pause'); return ok()
      case 'resume': scenario('resume'); return ok()
      case 'stop': scenario('stop'); return ok()
      case 'retry': startRun(); return ok({ runId: state.run.id })
      case 'setDirector': Object.assign(state.director, payload?.patch || {}); push(); return ok()
      case 'polishTopic': state.busy = 'AI 正在润色主题…'; push(); setTimeout(() => { state.busy = ''; state.director.topic = '【霍去病 · 封狼居胥】' + state.director.topic.replace(/^【[^】]*】/, ''); push(); toast('AI 已润色主题', 'success') }, 1200); return ok()
      case 'importFiles': {
        const files = payload?.files || []
        files.forEach((f, i) => state.assets.push({ id: 'imp-' + Date.now() + '-' + i, kind: /^image/.test(f.type) ? 'image' : /^video/.test(f.type) ? 'video' : /^audio/.test(f.type) ? 'music' : 'other', name: f.name, url: '', thumbUrl: '', durationSec: null, width: null, height: null, usedBySceneIds: [] }))
        push(); send({ type: 'dsh-vw/event', event: 'asset-added', data: { assetIds: state.assets.slice(-files.length).map((a) => a.id) } })
        return ok({ count: files.length, bytes: files.reduce((s, f) => s + (f.data?.byteLength || 0), 0) })
      }
      case 'removeAsset': state.assets = state.assets.filter((a) => a.id !== payload?.assetId); push(); return ok()
      case 'confirmStaging': { const it = state.staging.find((x) => x.id === payload?.stagingId); if (!it) return fail('未找到待确认素材'); state.staging = state.staging.filter((x) => x !== it); state.assets.push({ id: 'cloud-' + it.id, kind: it.kind === 'audio' ? 'music' : it.kind, name: it.name, url: it.url, thumbUrl: it.thumbUrl, durationSec: null, width: null, height: null, usedBySceneIds: [] }); push(); toast('已确认入库：' + it.name, 'success'); return ok() }
      case 'discardStaging': state.staging = state.staging.filter((x) => x.id !== payload?.stagingId); push(); return ok()
      case 'selectProject': { const p = state.projects.find((x) => x.dir === payload?.dir); if (!p) return fail('工程不存在'); state.project.title = p.title; state.project.dir = p.dir; push(); return ok() }
      case 'newProject': toast('（宿主）打开新建工程对话框'); return ok()
      case 'openPanel': toast('（宿主）打开面板：' + payload?.panel); return ok()
      case 'openScene': toast('（宿主）在分步精修中打开 ' + payload?.sceneId); return ok()
      case 'setSkin': $('#skin').value = payload?.skin; loadSkin(); return ok()
      case 'setLowSpec': $('#lowspec').classList.toggle('on', Boolean(payload?.on)); if (state) { state.lowSpec = Boolean(payload?.on); push() } return ok()
      case 'backToChat': toast('（宿主）返回 DSH 对话'); return ok()
      default: return fail('未知动作：' + action)
    }
  }

  window.addEventListener('message', (ev) => {
    if (ev.source !== frame.contentWindow) return
    const m = ev.data || {}
    if (m.type === 'dsh-vw/ready') { log('res', '→ ready from ' + m.skin); if (!state) state = baseState(); state.skin = $('#skin').value; send({ type: 'dsh-vw/state', state }) }
    else if (m.type === 'dsh-vw/action') { log('act', '→ action ' + m.action + ' ' + JSON.stringify(m.payload || {}, (k, v) => (v instanceof ArrayBuffer ? `<${v.byteLength} bytes>` : v)).slice(0, 300)); handleAction(m.id, m.action, m.payload || {}) }
    else log('warn', '→ unknown message ' + JSON.stringify(m).slice(0, 200))
  })

  function applyViewport() {
    const v = $('#vp').value
    const w = $('#frameWrap')
    if (v === 'fit') { w.classList.add('fit'); w.style.width = ''; w.style.height = ''; return }
    w.classList.remove('fit')
    const [vw, vh] = v.split('x').map(Number)
    w.style.width = vw + 'px'; w.style.height = vh + 'px'
  }
  function loadSkin() {
    const id = $('#skin').value
    const url = abs('../../packages/dsh-web-video-workbench/lib/warroom/' + id + '.html') + '?harness=1'
    frame.src = url
    if (state) state.skin = id
    history.replaceState(null, '', '?skin=' + id + '&vp=' + $('#vp').value)
  }

  document.querySelectorAll('[data-sc]').forEach((b) => b.addEventListener('click', () => scenario(b.dataset.sc)))
  $('#skin').addEventListener('change', loadSkin)
  $('#vp').addEventListener('change', () => { applyViewport(); history.replaceState(null, '', '?skin=' + $('#skin').value + '&vp=' + $('#vp').value) })
  $('#speed').addEventListener('change', () => { speed = Number($('#speed').value) || 1 })
  $('#toggleBar').addEventListener('click', () => $('#bar').classList.toggle('min'))
  $('#toggleLog').addEventListener('click', () => $('#log').classList.toggle('hidden'))
  $('#lowspec').addEventListener('click', () => { $('#lowspec').classList.toggle('on'); if (state) { state.lowSpec = $('#lowspec').classList.contains('on'); push() } })
  $('#avatar').addEventListener('click', () => { $('#avatar').classList.toggle('on'); if (state) { state.director.avatarEnabled = $('#avatar').classList.contains('on'); push() } })
  $('#staging').addEventListener('click', () => {
    const b = $('#staging'); b.classList.toggle('on')
    if (!state) state = baseState()
    state.staging = b.classList.contains('on')
      ? [{ id: 'stg-1', kind: 'image', name: '云端生图_河西走廊.png', url: COVERS[0], thumbUrl: COVERS[0], provider: 'Seedream 4.0', prompt: '河西走廊 落日 汉军骑兵剪影' }, { id: 'stg-2', kind: 'audio', name: 'MiniMax Music 3 试听.mp3', url: '', thumbUrl: '', provider: 'MiniMax Music 3', prompt: '90 BPM 战鼓 史诗' }]
      : []
    push()
  })

  // public hooks for automated checks (page-shot --eval)
  window.__harness = { scenario, startRun, complete, get state() { return state }, setSpeed: (n) => { speed = n }, push }

  if (qs.get('skin')) $('#skin').value = qs.get('skin')
  if (qs.get('vp')) $('#vp').value = qs.get('vp')
  applyViewport()
  fetch(abs('sample-project.json')).then((r) => r.json()).then((j) => { sample = j; state = baseState(); loadSkin() }).catch((e) => log('warn', 'sample-project.json: ' + e.message))
  frame.addEventListener('load', () => setTimeout(() => { if (state) send({ type: 'dsh-vw/state', state }) }, 300))
})()
</script>
